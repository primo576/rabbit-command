  <script>
let startTime;
let lastLapTime;
let timerId;

function format(ms) {

    const totalSeconds =
        Math.floor(ms / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    return (
        String(hours).padStart(2, '0') +
        ':' +
        String(minutes).padStart(2, '0') +
        ':' +
        String(seconds).padStart(2, '0')
    );
}

btnStart.onclick = () => {

    startTime = Date.now();
    lastLapTime = startTime;

    clearInterval(timerId);

    timerId = setInterval(() => {

        const elapsed =
            Date.now() - startTime;

        clock.textContent =
            format(elapsed);

    }, 100);
};
btnLap.onclick = () => {

    const now = Date.now();

    const lapTime =
        now - lastLapTime;
        

    lastLapTime = now;

    const li =
        document.createElement('li');

    li.textContent =
        format(lapTime);

    lapList.prepend(li);

};

function updateClock() {
  // Get the current time using the Date() object
  const now = new Date();

  // Format the time using the toLocaleTimeString() method
  const timeString = now.toLocaleTimeString();

  // Update the clock display by setting the innerHTML property of the clock div element
  const clock = document.getElementById('clockText');
  clock.innerHTML = timeString;
}

// Use the setInterval() method to call the updateClock() function every second
setInterval(updateClock, 1000);
updateClock();
  </script>


<script>
const STORAGE_KEY = 'LINKS';

function loadLinks() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}



function saveLinks(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function removeLinks() {
    localStorage.removeItem(STORAGE_KEY);
}

function renderLinks() {
    const LINKS = loadLinks();

    const div = document.getElementById('link');
    div.innerHTML = '';

    LINKS.forEach((i) => {
        const ahref = document.createElement('a');

        ahref.textContent = i.label;
        ahref.href = i.url;
        ahref.target = '_blank';

        ahref.className = 'object';

        

        div.appendChild(ahref);
        //div.appendChild(document.createElement('br'));
    });
}

document.getElementById('loadBtn').onclick = () => {
     text = document.getElementById('input')

    const oldLinks = loadLinks();
    newtext=''

    oldLinks.forEach(i=>{
        newtext+=`${i.label},${i.url}\n`
    })
      text.value=newtext
};

document.getElementById('saveBtn').onclick = () => {
    const text = document.getElementById('input').value.trim();

    const oldLinks = loadLinks();

    const newLinks = text
        .split('\n')
        .map(line => {
            const [label, url] = line.split(',');

            return {
                label: label?.trim(),
                url: url?.trim()
            };
        })
        .filter(i => i.label && i.url);

    const map = new Map();

    [...oldLinks, ...newLinks].forEach(i => {
        map.set(i.url, i); // 用 url 去重
    });

    const result = [...map.values()];

    saveLinks(result);
    renderLinks();
};

document.getElementById('allaudjestBtn').onclick = () => {
    removeLinks();
    const text = document.getElementById('input').value.trim();

    const oldLinks = loadLinks();

    const newLinks = text
        .split('\n')
        .map(line => {
            const [label, url] = line.split(',');

            return {
                label: label?.trim(),
                url: url?.trim()
            };
        })
        .filter(i => i.label && i.url);

    const map = new Map();

    [...oldLinks, ...newLinks].forEach(i => {
        map.set(i.url, i); // 用 url 去重
    });

    const result = [...map.values()];

    saveLinks(result);
    renderLinks();
};


renderLinks();
</script>
<script>
    async function renderIncidents() {
        const div = document.getElementById('incidentList');
        div.innerHTML = 'try Fetch...';
    const res = await fetch(
        //'https://www.cloudflarestatus.com/api/v2/incidents.json'
        'https://www.cloudflarestatus.com/api/v2/incidents/unresolved.json'
    );

    const data = await res.json();

    

    div.innerHTML = '';

       const ahref = document.createElement('a');

        ahref.textContent = 'CF status';
        ahref.href = 'https://new.cloudflarestatus.com/';
        ahref.target = '_blank';

        ahref.className = 'incident';
 div.appendChild(ahref);

    data.incidents.forEach(item => {
     
        const card = document.createElement('div');

        card.className = 'incident';

        card.innerHTML = `
            <h3>${item.name}</h3>
            <div>Status：${item.status}</div>
            <div>Impact：${item.impact}</div>
            <div>Start ：${new Date(item.started_at).toLocaleString()}</div>
            <div>Update：${new Date(item.updated_at).toLocaleString()}</div>
        `;

        div.appendChild(card);

    });

  //  

}

renderIncidents();
</script>
