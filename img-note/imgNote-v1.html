<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>imgNote</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--panel2:#20242d;--border:#303641;--text:#eef1f5;--muted:#9da5b2;--accent:#6ea8fe;--danger:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{height:100vh;display:flex;flex-direction:column}
header{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.logo{font-size:18px;font-weight:700}.count{color:var(--muted)}
.spacer{flex:1}button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{border-color:#4d5665}button.danger:hover{border-color:var(--danger);color:#ff9b9b}
.drop{margin:14px;border:1px dashed #4a5260;border-radius:10px;min-height:78px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--accent);background:#171d29;color:var(--text)}
.grid{padding:0 14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;overflow:auto}
.empty{grid-column:1/-1;text-align:center;padding:55px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative}
.thumb{height:210px;background:#0c0e12;display:flex;align-items:center;justify-content:center;cursor:pointer}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.meta{padding:10px 11px}.time{font-size:13px}.details{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px;margin-top:9px}.actions button{font-size:12px;padding:5px 8px}
.note{margin-top:8px;width:100%;min-height:32px;resize:vertical;background:#12151a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px;font:inherit}
.pin{position:absolute;top:8px;right:8px;background:#111b2b;border-radius:50%;width:30px;height:30px;padding:0}
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:25px}
.overlay.show{display:flex}.preview{overflow: auto;max-width:94vw;max-height:92vh;position:relative}.preview img{transition: width 0.2s ease;width:var(--imgWidth,100%);object-fit:contain}.close{position:absolute;right:-4px;top:-38px;font-size:18px}
input[type=file]{display:none}
.scale{    position: absolute;
    bottom: 50px;    z-index: 9999;}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.thumb{height:160px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">imgNote</div><div class="count" id="count">0 images</div><div class="spacer"></div><div class="drop" id="drop">貼上圖片（Ctrl / ⌘ + V）或將檔案拖曳到這裡</div>
  <label><button type="button" onclick="fileInput.click()">＋ Add</button><input id="fileInput" type="file" accept="image/*" multiple></label>
  <button class="danger" id="clearBtn">Clear All</button>
</header>

<main class="grid" id="grid"></main>
</div>
<div class="overlay" id="overlay"><button class="close" id="close">✕</button><div class="scale"><p>
                              <input type="range" min="100" max="500" value="100" id="slider">
                           </p></div><div class="preview"><img id="previewImg"></div></div>
<script>
const DB_NAME='imgNoteDB', STORE='images', DB_VERSION=1;
let db, items=[];
const $=s=>document.querySelector(s);
function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('createdAt','createdAt')}}
  r.onsuccess=e=>{db=e.target.result;resolve(db)}; r.onerror=()=>reject(r.error);
 });
}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function put(x){return new Promise((res,rej)=>{const r=tx('readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function remove(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function fmt(ts){return new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(ts))}
function size(n){const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
async function addBlob(blob){
 if(!blob||!blob.type.startsWith('image/'))return;
 const id=crypto.randomUUID(), createdAt=Date.now();
 const info=await new Promise(res=>{const im=new Image();const u=URL.createObjectURL(blob);im.onload=()=>{res({width:im.naturalWidth,height:im.naturalHeight});URL.revokeObjectURL(u)};im.src=u});
 await put({id,blob,createdAt,note:'',pinned:false,...info});
 await load();
}
async function load(){items=(await all()).sort((a,b)=>b.createdAt-a.createdAt);render()}
function render(){
 $('#count').textContent=`${items.length} image${items.length===1?'':'s'}`;
 const g=$('#grid');g.innerHTML='';
 if(!items.length){g.innerHTML='<div class="empty">尚無圖片<br>直接 Ctrl / ⌘ + V 貼上截圖即可</div>';return}
 for(const x of items){
  const card=document.createElement('article');card.className='card';
  const url=URL.createObjectURL(x.blob);
  card.innerHTML=`<button class="pin" title="Pin">${x.pinned?'📌':'📍'}</button>
   <div class="thumb"><img src="${url}"></div>
   <div class="meta"><div class="time">${fmt(x.createdAt)}</div>
   <div class="details">${x.width} × ${x.height} · ${size(x.blob.size)} · ${x.blob.type}</div>
   <textarea class="note" placeholder="Add note..."></textarea>
   <div class="actions"><button class="copy">Copy</button><button class="download">Download</button><button class="delete">Delete</button></div></div>`;
  card.querySelector('.note').value=x.note||'';
  card.querySelector('.note').addEventListener('change',async e=>{x.note=e.target.value;await put(x)});
  card.querySelector('.thumb').onclick=()=>{ $('#previewImg').src=url;$('#overlay').classList.add('show') };
  card.querySelector('.pin').onclick=async()=>{x.pinned=!x.pinned;await put(x);load()};
  card.querySelector('.delete').onclick=async()=>{await remove(x.id);load()};
  card.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({[x.blob.type]:x.blob})]);}catch{alert('瀏覽器不允許直接複製此圖片，請改用 Download。')}};
  card.querySelector('.download').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=`imgNote-${x.id}.${(x.blob.type.split('/')[1]||'png').replace('jpeg','jpg')}`;a.click()};
  g.appendChild(card);
 }
}
document.addEventListener('paste',e=>{const files=[...e.clipboardData.items].filter(i=>i.type.startsWith('image/'));for(const i of files)addBlob(i.getAsFile())});
$('#drop').addEventListener('dragover',e=>{e.preventDefault();$('#drop').classList.add('over')});
$('#drop').addEventListener('dragleave',()=>$('#drop').classList.remove('over'));
$('#drop').addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('over');[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(addBlob)});
$('#fileInput').addEventListener('change',e=>[...e.target.files].forEach(addBlob));
$('#clearBtn').onclick=async()=>{if(!items.length)return;if(confirm('確定刪除所有圖片？')){for(const x of items)if(!x.pinned)await remove(x.id);load()}};
$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};
$('#close').onclick=()=>$('#overlay').classList.remove('show');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').classList.remove('show')});
(async()=>{await openDB();await load()})();


////
const slider = document.getElementById('slider');
// 拉條改文字大小


slider.addEventListener('input', (e) => {
   document.documentElement.style.setProperty('--imgWidth', e.target.value + '%');
});
</script>
</body>
</html>
