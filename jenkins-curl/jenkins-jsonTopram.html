<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Jenkins API Form Builder</title>

<style>
body{
    font-family:sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:300px;
}

input,select{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    margin-bottom:10px;
}

button{
    padding:8px 12px;
}

.param{
    margin-bottom:15px;
}

pre{
    background:#111;
    color:#0f0;
    padding:15px;
    overflow:auto;
}
</style>
</head>
<body>

<h1>Jenkins API Form Builder</h1>

<div class="card">

<h3>Job URL</h3>

<input
id="jobUrl"
placeholder="https://jenkins.com/job/restartPod">

</div>

<div class="card">

<h3>API JSON</h3>

<textarea id="jsonInput"></textarea>

<button onclick="parseApi()">
解析 Jenkins API
</button>

</div>

<div class="card">

<h3>參數表單</h3>

<div id="formArea"></div>

</div>

<div class="card">

<button onclick="generateCurl()">
產生 CURL
</button>

<pre id="curlOutput"></pre>

</div>

<script>

let parameterDefs=[];

function parseApi(){

    let data;

    try{
        data=JSON.parse(
            document.getElementById('jsonInput').value
        );
    }
    catch(e){
        alert('JSON格式錯誤');
        return;
    }

    const formArea=
        document.getElementById('formArea');

    formArea.innerHTML='';

    parameterDefs=[];

    const property=
        data.property || [];

    property.forEach(prop=>{

        const defs=
            prop.parameterDefinitions || [];

        defs.forEach(param=>{

            parameterDefs.push(param);

            const div=
                document.createElement('div');

            div.className='param';

            const label=
                document.createElement('label');

            label.innerHTML=
                `<b>${param.name}</b>
                <br>
                ${param.description || ''}`;

            div.appendChild(label);

            if(param.choices){

                const select=
                    document.createElement('select');

                select.dataset.name=
                    param.name;

                param.choices.forEach(choice=>{

                    const option=
                        document.createElement('option');

                    option.value=choice;
                    option.textContent=choice;

                    select.appendChild(option);

                });

                div.appendChild(select);

            }
            else{

                const input=
                    document.createElement('input');

                input.dataset.name=
                    param.name;

                input.value=
                    param.defaultParameterValue?.value || '';

                div.appendChild(input);
            }

            formArea.appendChild(div);

        });

    });

}

function generateCurl(){

    const url=
        document.getElementById('jobUrl').value;

    let curl=
`curl -X POST \\
"${url}/buildWithParameters"`;

    document
        .querySelectorAll('[data-name]')
        .forEach(el=>{

            curl +=
`\n--data-urlencode "${el.dataset.name}=${el.value}"`;

        });

    document
        .getElementById('curlOutput')
        .textContent=curl;

}

</script>

</body>
</html>
