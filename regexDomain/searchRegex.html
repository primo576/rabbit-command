<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Regex Textarea Search</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  textarea { width: 100%; height: 150px; 
  white-space: nowrap;
    overflow-x: auto;
    overflow-y: auto;
  }
  .input1 { width: 300px; }

  .suggestion span {
    background: #eee;
    padding: 4px 8px;
    margin: 4px;
    display: inline-block;
    cursor: pointer;
  }
  @media (hover: none) and (pointer: coarse) {
  input, textarea, select {
    font-size: 16px;
  } 
}

table {
        td, th {
            border: 1px solid #c3c7cb;
            padding: .5rem .75rem;
        }
    }
  
</style>
</head>
<body>

<h3>Textarea Regex 搜尋</h3>

<textarea id="text"></textarea><br><br>

<label>Regex：</label>
<input id="pattern" placeholder="例如: error|warn" class="input1">
<div style="display: none;">
<label>Flags：</label>

<input id="flags" placeholder="例如: gi">
<h4>歷史：</h4>
<div id="history"></div>
</div>


<p id="error" class="error"></p>
    <details>
      <summary>更多</summary>
      <button onclick="search()">搜尋</button>
<p>推薦 Regex：</p>

<div class="suggestion" id="suggestion"></div>
<ol>
  <li> <button class="buttomStyle1" onclick="applyToAllTextareasSet()">全部展開</button><button class="buttomStyle1" onclick="applyToAllTextareasRm()">全部收起</button></li>
<li><input id="custom-join" placeholder="自訂結果組合方式 預設\n"></li>
<li><input type="checkbox" id="modeText">文字模式</li>
<li><input type="checkbox" id="modeUnique" checked="true">去重模式</li>
<li><input type="checkbox" id="modeHighlight">高亮模式</li>
<li><input type="checkbox" id="modeOnself">獨立顯示模式</li>
<li><input type="checkbox" id="modeSort">英文排序模式</li>
<li><input type="checkbox" id="modeSortLen">長度排序模式</li>
</ol>
<h4>結果：</h4>
    <details>
      <summary>regex參考</summary>
      <figure class="table-container"><table>
<thead>
<tr>
<th>字元</th>
<th>解說</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="#special-backslash"><code>\</code></a></td>
<td>反斜線放在非特殊符號前面，使非特殊符號不會被逐字譯出，代表特殊作用。 例如：'b' 如果沒有 '\' 在前頭，功能是找出小寫 b；若改為 '\b' 則代表的是邊界功能，block 用意。 /\bter\b/.test("interest") //false /\bter\b/.test("in ter est") //true <code>/a*/</code> 找出 0 個或是 1 個以上的 a；而 /a\*/ 找出 'a*' 這個字串 /aaaa*/g.test("caaady") //true /a\*/.test("caaady") //false '\' 也能使自身表現出來，表現 '\' ，必須以 '\\' 表達。 /[\\]/.test("&gt;\\&lt;") //true</td>
</tr>
<tr>
<td><a href="#special-caret"><code>^</code></a></td>
<td>匹配輸入的開頭，如果 multiline flag 被設為 true，則會匹配換行字元後。例如：<code>/^A/</code> 不會匹配「an A」的 A，但會匹配「An E」中的 A。「<code>^</code>」出現在字元集模式的字首中有不同的意思，詳見<a href="#special-negated-character-set">補字元集</a>。</td>
</tr>
<tr>
<td><a href="#special-dollar"><code>$</code></a></td>
<td>匹配輸入的結尾，如果 multiline flag 被設為 true，則會匹配換行字元。例如：<code>/t$/</code> 不會匹配「eater」中的 t，卻會匹配「eat」中的 t。</td>
</tr>
<tr>
<td><a href="#special-asterisk"><code>*</code></a></td>
<td>匹配前一字元 0 至多次。 下面舉例要求基本 'aaaa' ，'a*' 後面有 0 個或多個 a 的意思 /aaaaa*/g.test("caaady") //false 例如：<code>/bo*/</code> 匹配「A ghost booooed」中的 boooo、「A bird warbled」中的 b，但在「A goat grunted」中不會匹配任何字串。</td>
</tr>
<tr>
<td><a href="#special-plus"><code>+</code></a></td>
<td>匹配前一字元 1 至多次，等同於 <code>{1,}</code>。例如：<code>/a+/</code> 匹配「candy」中的 a，以及所有「caaaaaaandy」中的 a。</td>
</tr>
<tr>
<td><a href="#special-questionmark"><code>?</code></a></td>
<td>匹配前一字元 0 至 1 次，等同於 <code>{0,1}</code>。例如：<code>/e?le?/</code> 匹配「angel」中的 el、「angle」中的 le、以及「oslo」中的 l。如果是使用在 <code>*</code>、<code>+</code>、<code>?</code> 或 <code>{}</code> 等 quantifier 之後，將會使這些 quantifier non-greedy（也就是儘可能匹配最少的字元），與此相對的是 greedy（匹配儘可能多的字元）。例如：在「123abc」中應用 <code>/\d+/</code> 可匹配「123」，但使用 <code>/\d+?/</code> 在相同字串上只能匹配「1」。 Also used in lookahead assertions, as described in the <code>x(?=y)</code> and <code>x(?!y)</code> entries of this table.</td>
</tr>
<tr>
<td><a href="#special-dot"><code>.</code></a></td>
<td>（小數點）匹配除了換行符號之外的單一字元。例如：/.n/ 匹配「nay, an apple is on the tree」中的 an 和 on，但在「nay」中沒有匹配。</td>
</tr>
<tr>
<td><a href="#special-capturing-parentheses"><code>(x)</code></a></td>
<td>Capturing Parentheses 匹配 'x' 並記住此次的匹配，如下面的範例所示。在 正則表達示 /(foo) (bar) \1 \2/ 中的 (foo) 與 (bar) 可匹配了 "foo bar foo bar" 這段文字中的前兩個字，而 \1 與 \2 則匹配了後面的兩個字。注意， \1, \2, ..., \n 代表的就是前面的 pattern，以本範例來說，/(foo) (bar) \1 \2/ 等同於 /(foo) (bar) (foo) (bar)/。用於取代(replace)的話，則是用 $1, $2,...,$n。如 'bar boo'.replace(/(...) (...)/, '$2 $1'). <code>$&amp;</code> 表示已匹配的字串</td>
</tr>
<tr>
<td><a href="#special-non-capturing-parentheses"><code>(?:x)</code></a></td>
<td><em>Non-Capturing Parentheses</em>找出 'x'，這動作不會記憶 <code>()</code>為 group 的意思，檢查時會再 wrap 一次，若有 <code>g</code> flag 會無效， <code>?:</code> 代表只要 group 就好，不要 wrap 有無 <code>()</code> 差別 ？ <code>'foo'.match(/(foo)/)</code> <code>// ['foo', 'foo', index: 0, input: 'foo' ] 'foo'.match(/foo/) // [ 'foo', index: 0, input: 'foo' ]</code>有無<code>?:</code>差別？ <code>'foo'.match(/(foo){1,2}/) // [ 'foo', 'foo', index: 0, input: 'foo' ] 'foo'.match(/(?:foo){1,2}/) [ 'foo', index: 0, input: 'foo' ]</code> 連<code>()</code>都沒有，則<code>{1,2}</code>只是適用在<code>foo</code>的第二個<code>o</code>的條件而已。更多資訊詳見<a href="#使用括號">使用括號</a>。</td>
</tr>
<tr>
<td><a href="#special-lookahead"><code>x(?=y)</code></a></td>
<td>符合'x'，且後接的是'y'。'y'為'x'存在的意義。 例如：<code>/Jack(?=Sprat)/，</code>在後面是 Sprat 的存在下，Jack 才有意義。 <code>/Jack(?=Sprat|Frost)/</code>後面是 Sprat「或者是」Frost 的存在下，Jack 才有意義。但我們要找的目標是 Jack，後面的條件都只是 filter/條件的功能而已。</td>
</tr>
<tr>
<td><a href="#special-negated-look-ahead"><code>x(?!y)</code></a></td>
<td>符合'x'，且後接的不是'y'。'y'為否定'x'存在的意義，後面不行前功盡棄(negated lookahead)。 例如： <code>/\d+(?!\.)/</code> ，要找一個或多個數字時，在後面接的不是「點」的情況下成立。 <code>var result = /\d+(?!\.)/.exec("3.141")</code> ， result 執行出來為[ '141', index: 2, input: '3.141']， index:2，代表 141 從 index = 2 開始。</td>
</tr>
<tr>
<td><a href="#special-or"><code>x|y</code></a></td>
<td>符合「x」或「y」。舉例來說，<code>/green|red/</code> 的話，會匹配 <code>"green apple"</code> 中的 <code>"green"</code> 以及 <code>"red apple."</code> 的 <code>"red"</code> 。</td>
</tr>
<tr>
<td><a href="#special-quantifier"><code>{n}</code></a></td>
<td>規定符號確切發生的次數，n 為正整數例如：<code>/a{2}/</code>無法在 "candy" 找到、但 "caandy" 行；若字串擁有 2 個以上 "caaandy" 還是只會認前面 2 個。</td>
</tr>
<tr>
<td><a href="#special-quantifier-range"><code>{n,m}</code></a></td>
<td>搜尋條件：n 為至少、m 為至多，其 n、m 皆為正整數。若把 m 設定為 0，則為 Invalid regular expression。例如：<code>/a{1,3}/</code>無法在 "cndy" 匹配到；而在 "candy" 中的第 1 個"a"符合；在 "caaaaaaandy" 中的前 3 個 "aaa" 符合，雖然此串有許多 a，但只認前面 3 個。</td>
</tr>
<tr>
<td><a href="#special-character-set"><code>[xyz]</code></a></td>
<td>字元的集合。此格式會匹配中括號內所有字元, including <a href="/zh-TW/docs/Web/JavaScript/Guide/Grammar_and_types#unicode_escape_sequences">escape sequences</a>。特殊字元，例如點（<code>.</code>） 和米字號（<code>*</code>），在字元集合中不具特殊意義，所以不需轉換。若要設一個字元範圍的集合，可以使用橫線 <code>"-"</code> ，如下例所示： <code>[a-d]</code> 等同於 <code>[abcd]。</code>會匹配 "brisket" 的 "b" 、"city" 的 'c' ……等。 而<code>/[a-z.]+/</code> 和 <code>/[\w.]+/</code> 均可匹配字串 "test.i.ng" 。</td>
</tr>
<tr>
<td><a href="#special-negated-character-set"><code>[^xyz]</code></a></td>
<td>bracket 中寫入的字元將被否定，匹配非出現在 bracket 中的符號。 可用 '-' 來界定字元的範圍。一般直接表達的符號都可以使用這種方式。<code>[^abc]</code>可以寫作[^<code>a-c]</code>. "brisket" 中找到 'r' 、"chop."中找到 'h'。</td>
</tr>
<tr>
<td><a href="#special-backspace"><code>[\b]</code></a></td>
<td>吻合倒退字元 (U+0008). (不會跟 \b 混淆)</td>
</tr>
<tr>
<td><a href="#special-word-boundary"><code>\b</code></a></td>
<td>吻合文字邊界。A word boundary matches the position where a word character is not followed or preceded by another word-character. Note that a matched word boundary is not included in the match. In other words, the length of a matched word boundary is zero. (Not to be confused with <code>[\b]</code>.)Examples: <code>/\bm/</code> matches the 'm' in "moon" ; <code>/oo\b/</code> does not match the 'oo' in "moon", because 'oo' is followed by 'n' which is a word character; <code>/oon\b/</code> matches the 'oon' in "moon", because 'oon' is the end of the string, thus not followed by a word character; <code>/\w\b\w/</code> will never match anything, because a word character can never be followed by both a non-word and a word character.<strong>Note:</strong> JavaScript's regular expression engine defines a <a href="https://262.ecma-international.org/5.1/#sec-15.10.2.6" class="external" target="_blank">specific set of characters</a> to be "word" characters. Any character not in that set is considered a word break. This set of characters is fairly limited: it consists solely of the Roman alphabet in both upper- and lower-case, decimal digits, and the underscore character. Accented characters, such as "é" or "ü" are, unfortunately, treated as word breaks.</td>
</tr>
<tr>
<td><a href="#special-non-word-boundary"><code>\B</code></a></td>
<td>吻合非文字邊界。This matches a position where the previous and next character are of the same type: Either both must be words, or both must be non-words. The beginning and end of a string are considered non-words.For example, <code>/\B../</code> matches 'oo' in "noonday", and <code>/y\B./</code> matches 'ye' in "possibly yesterday."</td>
</tr>
<tr>
<td><a href="#special-control"><code>\cX</code></a></td>
<td>Where <em>X</em> is a character ranging from A to Z. Matches a control character in a string.For example, <code>/\cM/</code> matches control-M (U+000D) in a string.</td>
</tr>
<tr>
<td><a href="#special-digit"><code>\d</code></a></td>
<td>吻合數字，寫法等同於 <code>[0-9] 。</code>例如：<code>/\d/</code> 或 <code>/[0-9]/</code> 在 "B2 is the suite number." 中找到 '2'</td>
</tr>
<tr>
<td><a href="#special-non-digit"><code>\D</code></a></td>
<td>吻合非數字，寫法等同於 <code>[^0-9]。</code>例如：<code>/\D/</code> 或<code>/[^0-9]/</code> 在 "B2 is the suite number." 中找到 'B' 。</td>
</tr>
<tr>
<td><a href="#special-form-feed"><code>\f</code></a></td>
<td>Matches a form feed (U+000C).</td>
</tr>
<tr>
<td><a href="#special-line-feed"><code>\n</code></a></td>
<td>Matches a line feed (U+000A).</td>
</tr>
<tr>
<td><a href="#special-carriage-return"><code>\r</code></a></td>
<td>Matches a carriage return (U+000D).</td>
</tr>
<tr>
<td><a href="#special-white-space"><code>\s</code></a></td>
<td>Matches a single white space character, including space, tab, form feed, line feed. Equivalent to <code>[ \f\n\r\t\v\u00a0\u1680\u180e\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]</code>.For example, <code>/\s\w*/</code> matches ' bar' in "foo bar."</td>
</tr>
<tr>
<td><a href="#special-non-white-space"><code>\S</code></a></td>
<td>Matches a single character other than white space. Equivalent to <code>[^ \f\n\r\t\v\u00a0\\u1680u180e\u2000\u2001\u2002\u2003\u2004\u2005\u2006\u2007\u2008\u2009\u200a\u2028\u2029\u202f\u205f\u3000]</code>.For example, <code>/\S\w*/</code> matches 'foo' in "foo bar."</td>
</tr>
<tr>
<td><a href="#special-tab"><code>\t</code></a></td>
<td>Matches a tab (U+0009).</td>
</tr>
<tr>
<td><a href="#special-vertical-tab"><code>\v</code></a></td>
<td>Matches a vertical tab (U+000B).</td>
</tr>
<tr>
<td><a href="#special-word"><code>\w</code></a></td>
<td>包含數字字母與底線，等同於<code>[A-Za-z0-9_]</code>。例如： <code>/\w/</code> 符合 'apple'中的 'a' 、'$5.28 中的 '5' 以及 '3D' 中的 '3'。For example, <code>/\w/</code> matches 'a' in "apple," '5' in "$5.28," and '3' in "3D."</td>
</tr>
<tr>
<td><a href="#special-non-word"><code>\W</code></a></td>
<td>包含"非"數字字母與底線，等同於<code>[^A-Za-z0-9_]</code>。例如： <code>/\W/</code> 或是 <code>/[^A-Za-z0-9_]/</code> 符合 "50%." 中的 '%'For example, <code>/\W/</code> or <code>/[^A-Za-z0-9_]/</code> matches '%' in "50%."</td>
</tr>
<tr>
<td><a href="#special-backreference"><code>\n</code></a></td>
<td>其中 <em>n</em> 是一個正整數，表示第 <em>n</em> 個括號中的子字串匹配（包含括號中的所有的字串匹配）例如： <code>/apple(,)\sorange\1/</code> 符合 "apple, orange, cherry, peach." 的 'apple, orange,' 。（ `\1` 表示第一個 partten ，也就是 `(,)`）For example, <code>/apple(,)\sorange\1/</code> matches 'apple, orange,' in "apple, orange, cherry, peach."</td>
</tr>
<tr>
<td><a href="#special-null"><code>\0</code></a></td>
<td>Matches a NULL (U+0000) character. Do not follow this with another digit, because <code>\0&lt;digits&gt;</code> is an octal <a href="/zh-TW/docs/Web/JavaScript/Guide/Grammar_and_types#unicode_escape_sequences">escape sequence</a>. Instead use <code>\x00</code>.</td>
</tr>
<tr>
<td><a href="#special-hex-escape"><code>\xhh</code></a></td>
<td>Matches the character with the code hh (two hexadecimal digits)</td>
</tr>
<tr>
<td><a href="#special-unicode-escape"><code>\uhhhh</code></a></td>
<td>Matches the character with the code hhhh (four hexadecimal digits).</td>
</tr>
</tbody>
</table></figure>

 </details>


<div id="result"></div>





<script>
const suggestions = [
  { label: "清空", value: "" },
  { label: "Email", value: "[\\w.-]+@[\\w.-]+\\.\\w+" },
  { label: "IPv4", value: "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b" },
  { label: "IPv4:port", value: "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b:{0,}\\d{0,}"},
  { label: "數字", value: "\\d+" },
  { label: "英或數三個", value: "\\w{3}" },
  { label: "-或_", value: ".*(-|_).*" },
  { label: "空白行", value: "^\\s*$" },
  { label: "HTTP 200", value: " 200 " },
  { label: "http", value: "http.*" },
];

const historyList = [];

function parseDelimiter(str) {
  if (!str) return '\n'; // 預設

  return str
    .replace(/\\n/g, '\n')
    .replace(/\\t/g, '\t');
}

function applyToAllTextareasRm() {
  const list = document.getElementsByTagName('textarea');
  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    el.removeAttribute('style');
  }
}

function applyToAllTextareasSet() {
  const list = document.getElementsByTagName('textarea');
  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    auto_grow(el);
  }
}

    function auto_grow(el) {
    el.style.height = "5px"; // 先壓縮
    el.style.height = el.scrollHeight + "px"; // 再撐開
    //
    
    //
  }

function renderSuggestions() {
  const el = document.getElementById('suggestion');
  el.innerHTML = '';
  suggestions.forEach(s => {
    const span = document.createElement('span');
    span.textContent = s.label;
    span.onclick = () => {
      document.getElementById('pattern').value = s.value;
      search();
    };
    el.appendChild(span);
  });
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = historyList.map(h => `<div>${h}</div>`).join('');
}


function search() {
  const text = document.getElementById('text').value;

  const pattern = document.getElementById('pattern').value;
  if (text=='' || pattern=='') {
    document.getElementById('result').innerHTML=''
    return;
  }
  const flags = document.getElementById('flags').value;
  

  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');

  errorEl.textContent = '';
  resultEl.innerHTML = '';

  let regex;
  try {
    regex = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
  } catch (e) {
    errorEl.textContent = 'Regex 錯誤: ' + e.message;
    return;
  }

  // ===== 模式1：整段高亮 =====
   highlighted = text.replace(regex, match => {
    return `<span class="highlight">${match}</span>`;
  });
   regexN = new RegExp('\n', flags.includes('g') ? flags : flags + 'g');
   highlighted = highlighted.replace(regexN, match => {
    return `<br>`;
  });

  // ===== 模式2：每個結果獨立 =====
  const matches = [...text.matchAll(regex)];
  myarray=[];
  

  const listHtml = matches.map((m, idx) => {
    const value = m[0];
    const index = m.index;

    // 找所在行（實用）
    const lines = text.slice(0, index).split('\n');
    const lineNumber = lines.length;
    const lineText = text.split('\n')[lineNumber - 1];
    myarray.push(value)
   
    return `
      <div style="border:1px solid #ccc; padding:8px; margin:6px 0;">
        <b>#${idx + 1}</b><br>
        <b>Match:</b> ${value}<br>
        <b>Index:</b> ${index}<br>
        <b>Line:</b> ${lineNumber}<br>
        <b>Content:</b> ${lineText}
      </div>
    `;
  }).join('');
  const rawDelimiter = document.getElementById('custom-join').value;
  const delimiter = parseDelimiter(rawDelimiter);
  if (modeSort.checked || modeSortLen.checked) {
    myarray=myarray.sort()
  }
  if (modeSortLen.checked) {
    myarray=myarray.sort((a, b) => a.length - b.length);
  }
   uniqueArray = [...new Set(myarray)];
   hitcount=myarray.length
   uniqueArrayhitcount=uniqueArray.length
  uniqueArray=uniqueArray.join(delimiter)
  myarray=myarray.join(delimiter);
  output= ``;
  if (modeUnique.checked) {
    output+=` <h4>🔹 去重模式 ${uniqueArrayhitcount}</h4>
  <textarea >${uniqueArray}</textarea>`
  }
  if (modeText.checked) {
    output+=` <h4>🔹 文字模式 ${hitcount}</h4>
  <textarea >${myarray}</textarea>`
  }
  if (modeHighlight.checked) {
    output+=`<h4>🔹 高亮模式</h4>
    <div>${highlighted}</div>`
  }
  if (modeOnself.checked) {
    output+=`<h4>🔹 獨立結果 (${matches.length})</h4>
    <div>${listHtml || '無結果'}</div>`
  }
  
  resultEl.innerHTML =output
  if (output) {
    applyToAllTextareasSet();
  }
}
