<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>工程內部工具 - DNS 批次查詢</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: system-ui, -apple-system;
      background: #0b1220;
      color: #e5e7eb;
      padding: 20px;
    }
    textarea, select, button {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      height: 140px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      background: #2563eb;
      cursor: pointer;
      border: none;
      padding: 8px 16px;
    }
    button:hover {
      background: #1d4ed8;
    }
    pre {
      margin-top: 16px;
      background: #020617;
      padding: 12px;
      border-radius: 6px;
      max-height: 60vh;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
  

</head>
<body>

  <h2>🔧 工程內部 DNS 批次查詢工具</h2>

  <textarea id="domains" placeholder="google.com
cloudflare.com
example.com"></textarea>

  <div class="row">
    <select id="type">
      <option value="NS">NS</option>
      <option value="A">A</option>
      <option value="AAAA">AAAA</option>
      <option value="MX">MX</option>
      <option value="TXT">TXT</option>
    </select>
    <button onclick="run()">查詢</button>
    <button onclick="copy()">複製結果</button>
  </div>

  <pre id="output"></pre>

  <script>
    async function fetchDNS(url) {
      const res = await fetch(url, { headers: { accept: 'application/dns-json' } });
      const data = await res.json();
      if (!data.Answer) throw new Error('no answer');
      return data.Answer;
    }

    async function query(domain, type) {
      const cf = `https://cloudflare-dns.com/dns-query?name=${domain}&type=${type}`;
      const google = `https://dns.google/resolve?name=${domain}&type=${type}`;

      try {
        const ans = await fetchDNS(cf);
        return { api: 'Cloudflare', ans };
      } catch {
        const ans = await fetchDNS(google);
        return { api: 'Google', ans };
      }
    }

    async function run() {
      const domains = document.getElementById('domains').value
        .split('\n')
        .map(d => d.trim())
        .filter(Boolean);

      const type = document.getElementById('type').value;
      const out = document.getElementById('output');
      out.textContent = domains.length+' 個查詢中...\n';

      for (const domain of domains) {
        testTime= new Date().toLocaleString()
        out.textContent += `⏰ ${testTime}| `;
        try {
          const { api, ans } = await query(domain, type);
          const result = ans.map(a => a.data).join(' ');
          out.textContent += `✅ ${domain} [${type}] (${api}) → ${result}\n`;
        } catch (e) {
          out.textContent += `❌ ${domain} [${type}] → 失敗 / 無紀錄\n`;
        } 
      }
      out.textContent += domains.length+' 個域名完成...\n';
    }

    function copy() {
      navigator.clipboard.writeText(document.getElementById('output').textContent);
      alert('已複製到剪貼簿');
    }
  </script>

</body>
<script src="../public/floating-menu.js"></script>
</html>
