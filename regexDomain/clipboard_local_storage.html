<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>剪貼簿</title>
  <style>
    body { font-family: Arial; padding: 0px; }
     /*textarea#input { width: 100%; height: 80px; }*/
    .toolbar { margin: 8px 0; display: flex;flex-wrap: nowrap;}
    .itemO { margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 8px;list-style-position: inside; }
    .item {  margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 8px;list-style-position: inside; font-size: 12px;  }
    .time { font-size: 12px; color: gray;  height: 16px ;overflow: hidden;display: inline-flex;width:95%; }
    /* time 時間樣式 127x13.5 */
    .content { border-radius: 8px; width: calc(100% - 10px); height: 80px; overflow: auto; resize: none; }
    .expanded {  overflow: hidden; }
    .line0 { padding: 4px; border-bottom: 1px dashed #ddd; cursor: pointer;list-style-position: inside; font-size: 18px;}
    .line { font-size: var(--font-size, 18px);word-wrap: break-word;border-radius: 8px; margin-top: 10px; background: #eee; padding: 4px; border-bottom: 1px dashed #ddd; cursor: pointer;list-style-position: inside; }
    /* font-size: 18px; line的影響閱讀 可以做成動態 */
    .line0:hover { background: #eee; }
    .line:hover { background: #a2a2a2; }
    .bar-container { margin-top: 00px; height: 100px; overflow: auto;}
    .bar { height: 20px; margin: 4px 0; background: #ccc; cursor: pointer; position: relative; }
    .bar:hover { opacity: 0.8; }
    .bar span { position: absolute; left: 5px; font-size: 12px; }
    .progress { height: 20px; background: #4caf50; }
    .col {padding-inline-start: 0px;}
    .col2 {padding-inline-start: 30px;margin-block-start: 0;margin-block-end: 0;}
    .buttomStyle1{margin: 2px;}
    .buttomStyle1File{    appearance: none;
    background-color: initial;
    cursor: default;
    align-items: baseline;
    color: inherit;
    text-align: start !important;
    text-overflow: ellipsis !important;
    padding: initial;
    border: initial;
    white-space: pre;}

    input[type="file"] {
  display: none; /* Hide the actual input */
}

.custom-file-upload {
 appearance: auto;
    text-rendering: auto;
    color: buttontext;
    letter-spacing: normal;
    word-spacing: normal;
    line-height: normal;
    text-transform: none;
    text-indent: 0px;
    text-shadow: none;
    display: inline-block;
    text-align: center;
    background-color: buttonface;
    margin: 0em 0em 0em 0em;
    padding-block: 1px;
    padding-inline: 6px;
    border-style: double;
    border-color: buttonborder;
}

    .hide{display: none;}

    .textCenter{
      display: flex;
      justify-content: center;
      margin-block-start: 0em;
    margin-block-end: 0em;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;}
    .titleStyle{width: 100%;}

@media (hover: none) and (pointer: coarse) {
  input, textarea, select {
    font-size: 16px;
  }
}
  </style>
</head>
<body>
<div class="titleStyle">
<h2 id="titleA" class="textCenter">剪貼簿</h2>
<textarea class="content" id="input" placeholder="貼上內容..."></textarea>
</div>
<div class="toolbar ">
  <button class="paste-btn buttomStyle1" id="paste-btn" >貼上</button>
  <button  id="seveText-btn buttomStyle1"  onclick="mainaction()">保存文字</button>
  <button class="buttomStyle1" onclick="applyToAllTextareasSet()">全部展開</button>
  <button class="buttomStyle1" onclick="applyToAllTextareasRm()">全部收起</button>
  <button class="buttomStyle1" id="exportBtn">匯出</button>
  <label class="custom-file-upload buttomStyle1">匯入
  <input type="file" class="buttomStyle1File buttomStyle1" id="importFile"/>
  </label>
   <label class="custom-file-upload buttomStyle1" style="margin-left: 2px;">逐行文字大小
  <input type="range" min="10" max="50" value="18" id="slider">
  </label>
</div>

<div id="usage"></div>
<div class="bar-container" id="bars"></div>
<ol class="col" id="list"></ol>

<script>
const input = document.getElementById('input');
const list = document.getElementById('list');
const bars = document.getElementById('bars');
const usage = document.getElementById('usage');

////
    function auto_grow(el) {
    el.style.height = "5px"; // 先壓縮
    el.style.height = el.scrollHeight + "px"; // 再撐開
  }

function applyToAllTextareasRm() {
  const list = document.getElementsByTagName('textarea');

  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    el.removeAttribute('style');
  }
}

function applyToAllTextareasSet() {
  const list = document.getElementsByTagName('textarea');
  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    auto_grow(el);
  }
}

const pasteButton = document.getElementById('paste-btn');


pasteButton.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    input.value = text;
    mainaction();
  } catch (err) {
  }
});
////

let data = JSON.parse(localStorage.getItem('clipboardData')) || [];

data = data.map(item => {
  if (typeof item === 'string') return { text: item, time: Date.now(), expanded: false, lineMode: false };
  if (item.lineMode === undefined) item.lineMode = false;
  return item;
});

function save() {
  localStorage.setItem('clipboardData', JSON.stringify(data));
}

function getSize(obj) {
  return new Blob([JSON.stringify(obj)]).size;
}

function renderUsage() {
  const total = getSize(data);
  const max = 5 * 1024 * 1024;
  const percent = (total / max) * 100;
  const percentage = (total/1024/5120*100).toFixed(1)

  if (percentage>95){
      usage.innerHTML = `
    <div style="background:#ddd;width:100%;">
      <div class="progress" style="width:${percent}%"></div>
    </div>
    ${(total/1024).toFixed(1)}KB / 5120KB
  `;
  }

  console.log(`當前使用量：${percentage}% | 詳細：${(total/1024).toFixed(1)}KB / 5120KB`)
}

function renderBars() {
  bars.innerHTML = '';

  const maxSize = Math.max(...data.map(getSize));
  const ol = document.createElement('ol');
  ol.className="col2";

  data.forEach((item, index) => {
    const size = getSize(item);
    const percent = (size / maxSize) * 100;
    const li = document.createElement('li');
    li.className = 'bar';

    // 🔥 背景比例條
    li.style.background = `linear-gradient(to right, #4caf50 ${percent}%, #eee ${percent}%)`;

    // 👉 文字完整顯示
    li.textContent = `${new Date(item.time).toLocaleString()} - ${item.text.slice(0, 30)} (${(size/1024).toFixed(1)}KB)`;

    li.onclick = () => {
      document.getElementById(`item-${index}`)
        .scrollIntoView({ behavior: 'smooth' });
    };

    ol.appendChild(li);
  });

  bars.appendChild(ol);
}



function render() {

  list.innerHTML = '';
    //////
  function createBtnClickFun(BtnText,clickFun){
      const lineBtn = document.createElement('button');
      lineBtn.textContent = BtnText;
      lineBtn.className='buttomStyle1'
      lineBtn.onclick = () => {
        clickFun();
      };
      return lineBtn
  }
  //////

  data.forEach((item, index) => {
   //const div = document.createElement('div');
    const div = document.createElement('li');
    div.className = 'item';
    div.id = `item-${index}`;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = new Date(item.time).toLocaleString();

    const textarea = document.createElement('textarea');
    textarea.className = 'content';
    textarea.value = item.text;

    textarea.oninput = () => {
      item.text = textarea.value;
      save();
      renderBars();
      renderUsage();
      if (item.expanded) {
      auto_grow(textarea);
      }
    };

    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = item.expanded ? '收起' : '展開';
    toggleBtn.className='buttomStyle1'
    toggleBtn.onclick = () => {
      item.expanded = !item.expanded;
      save();
      render();
    };

    if (item.expanded) {
      textarea.classList.add('expanded');
      setTimeout(() => {
        auto_grow(textarea);
      }, 0);
    }
    ////
    const toggleBtnToLower = document.createElement('button');
    toggleBtnToLower.textContent = item.tolowered ? '原文' : '小寫';
    toggleBtnToLower.className='buttomStyle1'
    toggleBtnToLower.onclick = () => {
      item.tolowered = !item.tolowered;
      //save();
      render();
    };
    if (item.tolowered) {
      textarea.value=data[index].text.toLowerCase();
    }
    ////

    function lineMode(){
      item.lineMode = !item.lineMode;
      //save();展開後儲存狀態
      render();
    }

 

    function delLine(){
      console.log(data[index].text)
      data.splice(index, 1);
      save();
      render();
      titleChange('已刪除：'+time.textContent+"···log還有機會找到")  
      recoverTitle();
    }


    div.appendChild(time);
    div.appendChild(textarea);
    div.appendChild(createBtnClickFun('複製',()=>copyText(textarea.value,index)));
    div.appendChild(toggleBtn); //展開收起
    div.appendChild(createBtnClickFun('逐行',lineMode));
    div.appendChild(toggleBtnToLower);
    div.appendChild(createBtnClickFun('刪除',delLine));


    //if function要在按鈕建立之後 不然排版會混亂
      if (item.lineMode) {
        const ol = document.createElement('ol');
        ol.className = 'col';
      //const lines = item.text.split('\n').filter(l => l.trim());
      const lines = textarea.value.split('\n').filter(l => l.trim());
      lines.forEach(line => {
        //const ldiv = document.createElement('div');
        const ldiv = document.createElement('li');
        ldiv.className = 'line';
        ldiv.textContent = line;
       //ldiv.onclick = () => navigator.clipboard.writeText(line);
       ldiv.onclick = () => copyText(line,index);
       ol.appendChild(ldiv);
        div.appendChild(ol);
      });
    }

    list.appendChild(div);
  });

  renderBars();
  renderUsage();
}
///////
function recoverTitle(){
        setTimeout(() => {
          titleOrogin=document.getElementsByTagName('title')[0].textContent;
        titleChange(titleOrogin+randomFacetext());
      }, 3000);
}


function titleChange(string){
 titleA=document.getElementById('titleA');
 titleA.textContent=string
}

function copyText(text,index){
        navigator.clipboard.writeText(text)
        text20=text.slice(0, 20)
        titleChange('已複製：'+text20+"···")  
        recoverTitle();
        if (typeof(index)=='number'){
          nodeTimeTitle=document.getElementById(`item-${index}`).childNodes[0] 
          nodeTimeTitle.textContent='已複製：'+text20+"···"+randomFacetext()
      setTimeout(() => {
          nodeTimeTitle.textContent=new Date(data[index].time).toLocaleString()+"···"+randomFacetext()
      }, 3000);
        }
}

function getRandomInt(max) {
  return Math.floor(Math.random() * max);
}



// 匯出
exportBtn.onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup.json';
  a.click();
};

// 匯入
importFile.onchange = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    const imported = JSON.parse(reader.result);
    data = [...imported, ...data];
    save();
    render();
  };
  reader.readAsText(file);
};

// paste
input.addEventListener('paste', () => {
mainaction();
});

function mainaction(){
      setTimeout(() => {
    const value = input.value.trim();
    if (value) {
      data.unshift({ text: value, time: Date.now(), expanded: false, lineMode: false  });
      save();
      render();
      titleChange('已貼上：'+value.slice(0, 20)+"···")  
      recoverTitle();
      input.value = '';
    }
  }, 0);
}

render();
////
const slider = document.getElementById('slider');
// 拉條改文字大小


slider.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--font-size', e.target.value + 'px');
});
////
</script>
<script src="../public/floating-menu.js"></script>
<script src="../pet/desktop-cat.js"></script>
</body>
</html>
