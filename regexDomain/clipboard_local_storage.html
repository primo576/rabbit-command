<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clipboard + LocalStorage</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 80px; }
    .item { margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .time { display:block; font-size: 12px; color: gray; margin-bottom:5px; }
    button { margin-left: 10px; }
  </style>
</head>
<body>

<h2 id="mytitle">剪貼板</h2>

<textarea class="my-input" id="input" placeholder="貼上內容..." style="height: 23px;"></textarea>
<button class="paste-btn" id="paste-btn" >貼上</button>
<button onclick="applyToAllTextareasSet()">全部展開</button>
<button onclick="applyToAllTextareasRm()">全部收起</button>

<div id="list"></div>



<script>
  const input = document.getElementById('input');
  const list = document.getElementById('list');
  mycount=0

  // 讀取 localStorage
  let data = JSON.parse(localStorage.getItem('clipboardData')) || [];

  function save() {
    localStorage.setItem('clipboardData', JSON.stringify(data));
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleString();
  }

    function auto_grow(el) {
    el.style.height = "5px"; // 先壓縮
    el.style.height = el.scrollHeight + "px"; // 再撐開
  }

////
function applyToAllTextareasRm() {
  const list = document.getElementsByTagName('textarea');

  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    el.removeAttribute('style');
  }
}

function applyToAllTextareasSet() {
  const list = document.getElementsByTagName('textarea');

  for (let i = 1; i < list.length; i++) {
    const el = list[i];
    auto_grow(el);
  }
}
////


 function render() {
    list.innerHTML = '';

    data.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'item';

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatTime(item.time);

      const textarea = document.createElement('textarea');
      textarea.className = 'content';
      textarea.value = item.text;

      // ⭐ 重點：初始化時也要手動觸發
     // setTimeout(() => auto_grow(textarea), 0);

      // ⭐ 綁定 input 事件（你原本的寫法）
      textarea.addEventListener('input', () => auto_grow(textarea));

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '複製';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(item.text);
        //alert('已複製');
        mytitle.innerHTML= '已複製 '+mycount+' '+formatTime(item.time)
        mycount++;
      };

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.onclick = () => {
        data.splice(index, 1);
        save();
        render();
      };

      div.appendChild(time);
      div.appendChild(textarea);
      div.appendChild(copyBtn);
      div.appendChild(delBtn);
      list.appendChild(div);
    });
  }

  // 偵測貼上
  input.addEventListener('paste', (e) => {
    mainaction();
  });

  function mainaction(){
       setTimeout(() => {
      const value = input.value.trim();
      if (value) {
        data.unshift({
          text: value,
          time: Date.now()
        });
        save();
        render();
        input.value = '';
      }
    }, 0);
  }

  render();

const pasteButton = document.getElementById('paste-btn');


pasteButton.addEventListener('click', async () => {
  try {
   
    const text = await navigator.clipboard.readText();
    input.value = text;

    mainaction();
  } catch (err) {
  }
});

</script>
<script src="../public/floating-menu.js"></script>
</body>
</html>
