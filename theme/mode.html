<script>
document.getElementById('themeBtn').onclick = () => {
  setStyle('dark')
};

function setStyle(styleColor){
    //改變並寫入storage
  a=document.body.classList
  a.toggle(styleColor);
  localStorage.setItem('theme', a.value);
}

function initStyle(){
    //初始化樣式
const theme = localStorage.getItem('theme');
if (theme) {
  document.body.classList.add(theme);
}
}

initStyle()
